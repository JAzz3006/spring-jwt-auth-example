spring:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/app_db?currentSchema=secure_schema
    username: postgres
    password: postgres
    hikari:
      schema: secure_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS secure_schema
      connection-timeout: 10000
app:
  jwt:
    secret: "someSecretKey"
    tokenExpiration: 3m
    refreshTokenExpiration: 30m